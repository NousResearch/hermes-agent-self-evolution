# Editorial content for the Phase 4 validation report (synthesis / findings format).
# Rendered by generate_findings_report.py, which verifies every number in the
# provenance block against its committed source JSON and refuses to emit the PDF
# on any mismatch:
#   python generate_findings_report.py --prose reports/phase4_prose.yaml \
#       --out reports/phase4_validation_report.pdf

meta:
  title: "Agent Self-Evolution"
  subtitle: "Phase 4 Validation Report<br/>Tool implementation code via iterative test-feedback repair"
  organization: ""
  repository: "github.com/jramos/agent-self-evolution"

# Verified against the committed source JSONs before the PDF renders. Each check may
# name its own source; the top-level source is the default for checks that omit one.
