# Editorial content for the Phase 2 validation report.
# Numbers come from the run dir's gate_decision.json + metrics.json + run.log
# (passed via `generate_report.py --run output/<skill>/<ts>/`). Text blocks
# may include {placeholder} substitutions that the renderer fills from that
# extracted data. Run `python generate_report.py --help` for the full list.

meta:
  title: "Agent Self-Evolution"
  # <br/> is a reportlab Paragraph line break; renders the second line
  # below the first on the title page. _footer strips it before joining.
  subtitle: "Phase 2 Validation Report<br/>Closed-loop-aware deploy gate + tool-side parity"
  # Cover-page organization line. Set to "" to omit.
  organization: ""
  repository: "github.com/jramos/agent-self-evolution"

executive_summary:
  framework_intro: >
    Agent Self-Evolution is a standalone optimization pipeline that uses DSPy and GEPA
    (Genetic-Pareto Prompt Evolution) to automatically improve an agent's skills, tool
    descriptions, system prompts, and code through evolutionary search — all via API
    calls with no GPU training required. Phase 1 shipped the framework's first deploy
    gate (synthetic-only, paired-bootstrap CI, knee-point selection). Phase 2 makes the
    gate <i>behavior-aware</i> — it can now ship candidates whose synthetic signal is
    flat or slightly negative when the closed-loop behavioral signal demonstrably
    improves — and ships <i>tool-side parity</i>, so the same gate, audit trail, and
    automation run against tool descriptions as well as skill files.
  run_summary: >
    This report documents the Phase 2 validation of the closed-loop-aware deploy gate.
    We evolved the <b>{skill_name}</b> skill end-to-end with the gpt-5.4-mini optimizer
    stack and validated the candidate against a five-task behavioral suite executed
    end-to-end by the <font face="Courier">{validator_agent_model}</font> validator agent. The synthetic
    holdout delta came in tiny-and-negative ({avg_baseline:.3f} → {avg_evolved:.3f},
    Δ {improvement:+.3f}) — under Phase 1's strict-synthetic gate this candidate would
    have been rejected. The closed-loop signal told a different story: behavioral
    pass-rate went from <b>{cl_baseline_pass}/{cl_total_tasks}</b> to
    <b>{cl_evolved_pass}/{cl_total_tasks}</b> (gained <b>+{cl_tasks_gained}</b> tasks,
    required ≥{cl_required_gain}). The new gate consulted that signal directly and
    decided <b>{decision_upper}</b> via {decision_signal_phrase}; the synthetic sanity
    check passed (delta within the ±0.05 tolerance, so the synthetic regression is
    confirmed within noise).

key_result_box:
  title_template: "KEY RESULT — {skill_name} (skill-side deploy via CL-aware gate)"
  rows:
    - "Synthetic holdout (n={n_holdout}):   {avg_baseline:.3f} → {avg_evolved:.3f}   (Δ {improvement:+.3f})"
    - "Closed-loop tasks:   {cl_baseline_pass}/{cl_total_tasks} → {cl_evolved_pass}/{cl_total_tasks}   (+{cl_tasks_gained}, required ≥{cl_required_gain})"
    - "Synthetic sanity check:   {synth_sanity_passed_phrase} (Δ within ±0.05)"
    - "Decision:   {decision_upper}   via {decision_signal_phrase}"
  # Style picked by extracted data.decision: "deploy" → green, "reject" → amber.

background:
  intro: >
    Agent Self-Evolution targets the instructions layer of an LLM agent — skill files,
    tool descriptions, and system prompts — and evolves the text via API-only
    evolutionary search. The framework was originally built for Hermes Agent (Nous
    Research) but a pluggable <font face="Courier">SkillSource</font> protocol now
    discovers artifacts in the Hermes Agent layout, the Claude Code plugin cache, or
    any flat local directory. An agent's behavior is governed by three layers:
  layers:
    header: ["Layer", "What It Is", "How It's Currently Improved"]
    rows:
      - ["Model Weights", "The underlying LLM (Claude, GPT, etc.)", "RL training (Tinker-Atropos)"]
      - ["Instructions", "Skills, system prompts, tool descriptions", "Manual authoring (static)"]
      - ["Tool Code", "Python implementations of each tool", "Manual development"]
    # 0-indexed row to highlight (after the header).
    highlight_row: 1
  closing: >
    Phase 1 validated the framework end-to-end on the instructions layer with a
    synthetic-only deploy gate. Phase 2 extends that gate in two ways. First, the gate
    is now <b>behavior-aware</b>: alongside the synthetic LLM-as-judge holdout, every
    candidate is exercised on a closed-loop behavioral suite — real tasks scored by a
    validator agent — and the gate can deploy on the behavioral signal directly when
    the synthetic signal is flat. Synthetic eval can saturate (every candidate scores
    near 1.0) or drift; the closed-loop signal answers the question that actually
    matters at deploy time: <i>does this candidate help the agent succeed at real
    tasks?</i> Second, the same gate, runner, and automation now apply to <b>tool
    descriptions</b> via <font face="Courier">evolve_tool.py</font>, achieving full
    parity with the skill-side <font face="Courier">evolve_skill.py</font> pipeline.

approach:
  engines:
    header: ["Engine", "What It Optimizes", "License", "Role"]
    rows:
      - ["DSPy + GEPA", "Skills, prompts, tool descriptions", "MIT", "Primary (validated)"]
      - ["DSPy MIPROv2", "Few-shot examples, instruction text", "MIT", "Fallback optimizer"]
      - ["Iterative test-feedback repair", "Tool implementation code", "MIT", "Code repair (Phase 4)"]
  gepa_narrative: >
    <b>GEPA</b> (Genetic-Pareto Prompt Evolution) is the star engine — an ICLR 2026
    Oral paper from Stanford/UC Berkeley. Unlike traditional evolutionary search that
    only sees pass/fail scores, GEPA reads full execution traces to understand
    <i>why</i> things failed, then proposes targeted mutations. It outperforms
    reinforcement learning (GRPO) by +6% with 35x fewer rollouts, and outperforms
    DSPy's previous best optimizer (MIPROv2) by +10%. It works with as few as 3
    training examples. Phase 2 ships two refinements to how GEPA is driven: a
    <b>saturation pre-flight</b> that refuses to spend budget on baselines with no
    headroom, and an <b>improvement-or-equal acceptance criterion</b> that halves the
    false-rejection rate at the noise floor.
  pipeline_steps:
    - "<b>Saturation pre-flight</b> — Score the baseline on a sample of synthetic + closed-loop examples; refuse to run if the baseline lands in the <font face=\"Courier\">no_headroom</font>, <font face=\"Courier\">uniform_failure</font>, or <font face=\"Courier\">weak_signal</font> band (cost-saving guard added this cycle)"
    - "<b>Discover and load artifact</b> — Resolve the skill (or tool) via the SkillSource / ToolSource protocol, parse YAML frontmatter and body"
    - "<b>Generate eval dataset</b> — An LLM reads the artifact and synthesizes (task, expected_behavior) pairs, then splits into train / val / holdout"
    - "<b>Wrap as DSPy module</b> — The artifact text becomes a parameterized DSPy module where the instructions are the optimizable parameter"
    - "<b>Run optimizer</b> — DSPy GEPA evolves the instructions with improvement-or-equal acceptance, scored by an LLM-as-judge with a structured rubric"
    - "<b>Knee-point selection</b> — Among candidates within ε of the val-best, pick the highest-val candidate (smallest body as tiebreak)"
    - "<b>Dual-signal deploy gate</b> — Score the candidate on the synthetic holdout (paired-bootstrap CI) AND execute it on a closed-loop behavioral suite; the gate consults a <font face=\"Courier\">decision_signal</font> field and may deploy via the closed-loop path when synthetic is flat but behavior gains ≥ required threshold"
    - "<b>Report</b> — Structured <font face=\"Courier\">gate_decision.json</font> (v5 schema, with CL-primary fields), before/after artifacts, full LM trace log, opt-in <font face=\"Courier\">--create-pr</font> automation"
  cost_paragraph: >
    The <b>saturation pre-flight</b> is the new cost-control story for Phase 2.
    Synthetic LLM-as-judge fitness saturates aggressively at this validator tier: in
    preparing this report we ran the pre-flight against three candidate headline
    artifacts and two of them — <font face="Courier">search_files</font> (a tool
    description) and a deliberately-weakened <font face="Courier">write_file</font>
    suite — were correctly refused as saturated against the validator's
    <font face="Courier">gpt-5.4-mini</font> tier. The pre-flight kept us from spending
    GEPA budget on baselines GEPA cannot beat. The headline run reported here
    (<b>{skill_name}</b>) cleared the pre-flight in the <i>weak_signal</i> band — the
    band the gate was redesigned for — and consumed
    <b>${cost_total_usd:.2f}</b> across {lm_calls_metrics:,} LM calls in
    ~{elapsed_minutes:.0f} minutes. <b>Tool-side parity</b> is the second Phase 2
    deliverable: <font face="Courier">evolve_tool.py</font> ships the same GEPA runner,
    dataset builder, quality-gate, audit trail, and opt-in PR automation as
    <font face="Courier">evolve_skill.py</font>. The headline result lands skill-side
    because the closed-loop suites we have for tool-side surfaces are saturated for our
    current validator tier — the deliverable is full parity, ready for harder
    tool-side eval surfaces.

experiment:
  section_title: "Phase 2 Experiment"
  # Configuration table. Numeric / per-run rows are auto-derived from the run JSONs;
  # rows below are static labels that don't change between runs.
  config_overrides:
    target_skill_label: "{skill_name} (weakened systematic-debugging — deliberately-weakened baseline that lands in the <i>weak_signal</i> saturation band, exercising the CL-aware deploy path)"
    optimizer_lm: "openai/gpt-5.4-mini"
    reflection_lm: "openai/gpt-5.4-mini"
    eval_judge_lm: "openai/gpt-5.4-mini"
    optimizer_label: "DSPy GEPA (light budget; improvement-or-equal acceptance)"
    quality_gate_label: "dual-signal — synthetic holdout (paired-bootstrap CI) + closed-loop behavioral suite (CL-primary on tie)"
    knee_point_strategy_label: "val-best (default; smallest available via --knee-point-strategy)"
  dataset_intro: >
    The evaluation dataset was synthetically generated by openai/gpt-5.4-mini. Given
    the full {skill_name} SKILL.md text, the model produced {n_examples} realistic test
    cases with rubric-based expected behaviors, then split them into train / val /
    holdout per the framework's configured ratios. The closed-loop validation suite is
    a separate five-task <font face="Courier">systematic_debugging.jsonl</font>
    behavioral benchmark executed end-to-end by the validator agent — those tasks are
    not part of the synthetic split and are evaluated only on the baseline and the
    final knee-point candidate. Examples drawn from the synthetic train split:
  fitness_intro: >
    Synthetic fitness is measured by an LLM-as-judge (gpt-5.4-mini) that scores each
    candidate output along three rubric dimensions. The composite score is a weighted
    combination with a length-penalty term that discourages runaway expansion:
  fitness_formula: "composite = 0.5·correctness + 0.3·procedure_following + 0.2·conciseness − length_penalty"
  fitness_closing: >
    The judge also returns a free-text feedback string that GEPA's reflection LM
    consumes to propose targeted instruction-text mutations on the next iteration —
    this trace-aware loop is the core of GEPA's sample efficiency. Phase 2 adds a
    second, independent fitness signal at gate time: <b>closed-loop behavioral
    pass-rate</b> on a small held-out task suite executed by a validator agent. The
    gate consults both signals — synthetic for sanity (±0.05 tolerance), closed-loop
    for the deploy decision when synthetic is flat.

results:
  narrative: >
    The evolved {skill_name} skill grew <b>{growth_pct:+.1%}</b>
    ({baseline_chars:,} → {evolved_chars:,} chars) and the synthetic holdout score
    moved <b>{improvement:+.3f}</b> ({avg_baseline:.3f} → {avg_evolved:.3f}) on
    n={n_holdout} examples. The synthetic delta is tiny-and-negative — under Phase 1's
    no-regression rule, this candidate would have been rejected. Phase 2's
    behavior-aware gate looked at the closed-loop signal instead: behavioral pass-rate
    went from <b>{cl_baseline_pass}/{cl_total_tasks}</b> tasks to
    <b>{cl_evolved_pass}/{cl_total_tasks}</b> (gained <b>+{cl_tasks_gained}</b>,
    required ≥{cl_required_gain}). The synthetic sanity check passed (delta inside the
    ±0.05 noise envelope), so the synthetic regression is statistically indistinguishable
    from noise while the behavioral improvement is large and concrete. <b>Decision:
    {decision_upper}</b> via {decision_signal_phrase}. This is the textbook case the
    Phase 2 gate was redesigned for.
  how_produced_intro: "GEPA evolves skill instructions through a reflective loop; Phase 2's gate then reads two independent signals at decision time:"
  how_produced_steps:
    - "Run candidate skill instruction text on training examples; the judge scores each output and emits free-text feedback"
    - "Reflection LM reads the execution traces + feedback and proposes a targeted mutation of the instruction text (Phase 2: improvement-or-equal acceptance keeps near-ties in the population)"
    - "Score the mutated candidate on the validation set ({n_val} examples); track every candidate's per-example Pareto front"
    - "After GEPA's light-budget search, freeze the candidate population; knee-point selection picks candidate {knee_picked_idx} (val={knee_picked_val_score:.3f}, rank {knee_picked_rank} of {knee_band_size} in the ε-band, {knee_picked_body_chars:,} body chars){knee_default_match_phrase}"
    - "<b>Dual-signal gate</b> — Score the knee-point pick on the {n_holdout}-example synthetic holdout (paired-bootstrap CI on per-example diffs) AND execute it on the closed-loop behavioral suite ({cl_total_tasks} tasks, scored by the <font face=\"Courier\">{validator_agent_model}</font> validator). The gate sets <font face=\"Courier\">decision_signal</font> based on which signal carries the decision; on this run synthetic was flat-within-tolerance and closed-loop gained {cl_tasks_gained} tasks, so the gate deployed via the closed-loop path."
  how_produced_closing: >
    Three Phase 2 design choices made this outcome possible: (a) the dual-signal gate
    deploys on either signal, so a flat synthetic doesn't veto a real behavioral gain;
    (b) the synthetic sanity check still guards against unambiguous synthetic
    regressions (±0.05 tolerance); (c) the saturation pre-flight refused two of three
    candidate headline artifacts before this run, which is honest evidence that the
    current validator tier saturates aggressively on our existing eval surfaces — the
    Phase 2 gate exists specifically to recover deploy decisions on the artifacts that
    do clear the pre-flight in the <i>weak_signal</i> band. The CL-aware deploy gate
    arc is supported by a broader May-cycle calibration campaign across nano-pdf,
    apple-notes, polymarket, and huggingface-hub
    (<font face="Courier">reports/calibration_findings.md</font>) — that campaign
    contributed the improvement-or-equal acceptance default, retired the knee-point ε
    selector as a no-op on val-best, and recommended the non-inferiority tolerance
    sweet spot used by the synthetic sanity check.

safety:
  intro: "Every evolved variant must pass all of the following constraints before deployment:"
  table:
    header: ["Constraint", "Enforcement", "Status"]
    rows:
      - ["Self-evolution test suite", "1,166 pytest tests pass on the optimizer itself", "Implemented"]
      - ["Static size limits", "Skills ≤15KB, tool descs ≤500 chars (configurable)", "Implemented"]
      - ["Absolute char ceiling", "Hard cap on evolved artifact size (default 5,000)", "Implemented"]
      - ["Growth-quality gate", "Required improvement scales linearly with growth %", "Implemented"]
      - ["Paired-bootstrap CI", "90% CI on per-example holdout diffs gates deploy", "Implemented"]
      - ["Knee-point selection", "Smallest candidate within ε of val-best", "Implemented"]
      - ["Structural integrity", "Valid YAML frontmatter required", "Implemented"]
      - ["Deployment via PR", "Human review required, never auto-merge", "By design"]
      - ["CL-aware deploy gate", "Deploys via closed-loop signal when CL gain ≥ required AND synthetic delta within ±0.05", "Implemented"]
      - ["Saturation pre-flight", "Refuses to spend budget on no_headroom / uniform_failure / weak_signal baselines", "Implemented"]
      - ["GEPA improvement-or-equal", "Candidates accepted on ≥ (not strict >); halves false-rejection at the noise floor", "Implemented"]
      - ["PR automation audit trail", "Opt-in --create-pr opens draft PR; pr_created field logs branch + SHA + URL", "Implemented"]
      - ["Benchmark regression", "TBLite / skill-specific harness must hold", "Planned"]
  closing: >
    Source skill and tool repositories are never modified directly. All evolution
    output (evolved artifacts, gate decisions, run logs, closed-loop validation
    transcripts) is written under the framework's local
    <font face="Courier">output/</font> directory, and improvements are proposed as
    draft pull requests against the source repo for human review.

roadmap:
  table:
    header: ["Phase", "Target", "Engine", "Timeline", "Status"]
    rows:
      - ["Phase 1", "Skill files (SKILL.md)", "DSPy + GEPA", "3-4 weeks", "Validated ✓"]
      - ["Phase 2", "Tool descriptions", "DSPy + GEPA", "2-3 weeks", "Validated ✓"]
      - ["Phase 3", "System prompt sections", "DSPy + GEPA", "2-3 weeks", "Validated ✓"]
      - ["Phase 4", "Tool implementation code", "Iterative test-feedback repair", "3-4 weeks", "Validated ✓"]
      - ["Phase 5", "Continuous improvement", "Propose-only triage sentinel", "2 weeks", "Shipped ✓"]
    # 0-indexed row to highlight (after the header). Phase 2 = 1.
    highlight_row: 1
  closing: >
    Each phase must demonstrate measurable improvement and pass benchmark regression
    gates before proceeding. Phase 2 ships the deploy gate's behavioral awareness AND
    tool-side parity — the gate is no longer hostage to synthetic-eval saturation, and
    the same automation that gated skill evolution now gates tool-description
    evolution. Phase 3 (system-prompt sections) is the next surface; Phase 5
    (continuous improvement) closes the loop with automated cron-driven optimization.

next_steps:
  - "<b>Phase 3 scoping</b> — System-prompt sections as the next evolvable surface. The instructions layer remains the target; system prompts complete the trio of skills / tools / system prompts and are the highest-leverage instructions surface for most agents."
  - "<b>Eval-surface hardening</b> — Develop harder closed-loop suites and synthetic generators so the saturation pre-flight is less often the dominant outcome at the gpt-5.4-mini validator tier. The Phase 2 gate works; the bottleneck is now the eval surfaces feeding it."
  - "<b>Cross-tool portfolio campaign</b> — Run the CL-aware deploy gate against the realistic manifest's tool descriptions to surface which tool-side artifacts have headroom under the current validator tier — analogous to the May skill-side calibration campaign that produced the improvement-or-equal acceptance default."
  - "<b>Phase 5 — continuous improvement</b> — Cron-driven optimization with budget gates, alerting, and an opt-in PR-automation queue. The <font face=\"Courier\">--create-pr</font> primitive shipped in Phase 2 is the prerequisite; Phase 5 wires it into a scheduled loop with backstop budgets."
