name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - sprint/kafo-evo-001-adaptive-loop

permissions:
  contents: read

# PR runs use refs/pull/<n>/merge and pushes use refs/heads/<branch>, so the
# two never cancel each other. A newer commit cancels the older run on the
# same ref; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q
