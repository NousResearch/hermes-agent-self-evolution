name: Phase 2 tool description gate

on:
  pull_request:
    paths:
      - "evolution/tools/**"
      - "tests/tools/**"
      - "datasets/golden/tool-description/**"
      - "reports/phase2e_*"
      - "README.md"
      - "PLAN.md"
      - "pyproject.toml"
      - ".github/workflows/phase2-tool-description-gate.yml"
  push:
    branches: [main]
    paths:
      - "evolution/tools/**"
      - "tests/tools/**"
      - "datasets/golden/tool-description/**"
      - "reports/phase2e_*"
      - "README.md"
      - "PLAN.md"
      - "pyproject.toml"
      - ".github/workflows/phase2-tool-description-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-tool-description-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # refs/tags/v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # refs/tags/v5
        with:
          python-version: "3.11"

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused Phase 2 tool-description tests
        run: |
          python -m pytest \
            tests/tools/test_tool_description_eval.py \
            tests/tools/test_evolve_tool_descriptions.py \
            tests/tools/test_report_contract.py \
            tests/tools/test_heldout_tool_selection_review.py \
            tests/tools/test_expanded_holdout_decision.py \
            tests/tools/test_phase2_benchmark_gate_decision.py \
            tests/tools/test_phase2_automation.py \
            -q

      - name: Build deterministic 45-case CI inventory
        run: |
          mkdir -p output/tool-description/phase2-ci-gate
          python - <<'PY'
          import json
          from pathlib import Path

          from evolution.tools.tool_description_eval import default_tool_selection_cases

          cases = default_tool_selection_cases()
          assert len(cases) == 45, f"expected 45 default tool-selection cases, got {len(cases)}"

          tool_names = sorted(
              {case.expected_tool for case in cases}
              | {tool for case in cases for tool in case.confusing_tools}
          )
          records = []
          for name in tool_names:
              cues = []
              for case in cases:
                  if case.expected_tool == name:
                      cues.extend(case.required_cues)
                      cues.extend(case.required_arguments)
              cue_text = " ".join(dict.fromkeys(cues[:12]))
              records.append(
                  {
                      "name": name,
                      "toolset": name.split("_", 1)[0] if "_" in name else name,
                      "description": f"{name} tool. Use for {cue_text}." if cue_text else f"{name} tool.",
                      "schema": {"parameters": {"properties": {}}},
                  }
              )

          Path("output/tool-description/phase2-ci-gate/inventory.json").write_text(
              json.dumps({"tools": records}, indent=2, sort_keys=True) + "\n"
          )
          print(f"wrote deterministic CI inventory for {len(cases)} cases and {len(records)} tools")
          PY

      - name: Run candidate-only 45-case Phase 2D gate
        run: |
          python -m evolution.tools.evolve_tool_descriptions \
            --inventory-json output/tool-description/phase2-ci-gate/inventory.json \
            --output-dir output/tool-description/phase2-ci-gate/run

      - name: Validate candidate-only report contract
        run: |
          python -m evolution.tools.report_contract \
            output/tool-description/phase2-ci-gate/run/candidate_only_report.json

      - name: Run SessionDB holdout review smoke
        run: |
          python -m evolution.tools.heldout_tool_selection_review \
            --inventory-json output/tool-description/phase2-ci-gate/run/inventory.json \
            --candidates-json output/tool-description/phase2-ci-gate/run/candidate_descriptions.json \
            --cases-jsonl datasets/golden/tool-description/session_misfire_holdout.jsonl \
            --output-json output/tool-description/phase2-ci-gate/run/heldout_review.json

      - name: Record expanded holdout decision smoke
        run: |
          python -m evolution.tools.expanded_holdout_decision \
            --holdout-jsonl datasets/golden/tool-description/session_misfire_holdout.jsonl \
            --heldout-review-json output/tool-description/phase2-ci-gate/run/heldout_review.json \
            --output-json output/tool-description/phase2-ci-gate/run/expanded_holdout_decision.json \
            --output-md output/tool-description/phase2-ci-gate/run/expanded_holdout_decision.md

      - name: Assert Phase 2D gate result is automation-safe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("output/tool-description/phase2-ci-gate/run/candidate_only_report.json")
          decision_path = Path("output/tool-description/phase2-ci-gate/run/expanded_holdout_decision.json")
          report = json.loads(report_path.read_text())
          decision = json.loads(decision_path.read_text())
          gate = report["phase2d_gate"]

          assert report["mode"] == "candidate-only"
          assert report["apply_ready"] is False
          assert report["metrics"]["case_count"] == 45
          assert gate["thresholds"]["min_case_count"] == 45
          assert gate["passed"] is True, gate["failed_checks"]
          assert gate["failed_checks"] == []
          assert report["inventory_metadata"]["candidate_quality_warnings_are_separate"] is True
          assert decision["mode"] == "expanded-holdout-decision"
          assert decision["candidate_only"] is True
          assert decision["apply_ready"] is False
          assert decision["combined_slice"]["case_count"] == 54
          assert decision["requires_100_case_slice_before_phase2_closeout"] is False
          assert decision["coverage_delta"]["new_expected_tools_from_holdout"] == []
          assert decision["coverage_delta"]["new_confusion_pairs_from_holdout"] == []
          print(f"Phase 2D 45-case gate passed and contract is automation-safe: {report_path}")
          PY
