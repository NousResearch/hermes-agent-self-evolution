[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-self-evolution"
version = "0.1.0"
description = "Evolutionary self-improvement for Hermes Agent — optimize skills, prompts, tool descriptions, and code using DSPy + GEPA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nous Research", email = "team@nousresearch.com"},
]
keywords = ["llm", "optimization", "evolution", "dspy", "gepa", "hermes", "agent"]

dependencies = [
    # dspy[optuna] pulls in optuna, which MIPROv2 requires. MIPROv2 is the
    # automatic fallback path in evolve_skill.py when GEPA fails to initialize
    # (e.g. on DSPy >=3.0 where GEPA's __init__ signature changed). Without
    # the [optuna] extra the fallback crashes with ModuleNotFoundError, so the
    # whole pipeline is broken on stock installs.
    #
    # Upper bounds are pinned to limit supply chain risk and to fence off API
    # breaks: DSPy's GEPA/MIPROv2 signatures changed across 3.x minors, openai
    # 2.x is a breaking rewrite, and PyYAML/Click/Rich each ship CVEs we want
    # to opt into rather than be auto-bumped through.
    "dspy[optuna]>=3.0.0,<4",
    "openai>=1.40.0,<3",
    "pyyaml>=6.0,<7",
    "click>=8.0,<9",
    "rich>=13.0,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
    "pytest-asyncio>=0.21,<2",
]
darwinian = [
    "darwinian-evolver",
]
# generate_report.py uses reportlab to produce the validation PDF. Optional
# because the pipeline itself does not depend on PDF generation.
report = [
    "reportlab>=4.0,<5",
]

[project.urls]
Homepage = "https://github.com/NousResearch/hermes-agent-self-evolution"
Repository = "https://github.com/NousResearch/hermes-agent-self-evolution"

[tool.setuptools.packages.find]
include = ["evolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
